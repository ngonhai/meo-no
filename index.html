<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mèo Nổ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

  <section id="screen-loading" class="screen active"><div class="loading-spinner"></div></section>

  <!-- ============ LOBBY ============ -->
  <section id="screen-lobby" class="screen">
    <div class="lobby-card poly">
      <select class="lang-select lobby-lang" aria-label="Language"></select>
      <div class="lobby-logo" id="lobby-logo"></div>
      <h1 class="lobby-title" id="lobby-title"></h1>
      <p class="lobby-sub muted" id="lobby-sub"></p>

      <label for="input-name" id="lbl-name"></label>
      <input type="text" id="input-name" maxlength="16" autocomplete="off">

      <div class="resume-card" id="resume-card" style="display:none">
        <div class="resume-text"><b id="resume-title"></b><p class="muted" id="resume-body"></p></div>
        <button type="button" class="btn" id="btn-resume"></button>
      </div>

      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="create" id="tab-btn-create"></button>
        <button type="button" class="tab-btn" data-tab="join" id="tab-btn-join"></button>
        <button type="button" class="tab-btn" data-tab="offline" id="tab-btn-offline"></button>
      </div>
      <div class="tab-panel active" id="tab-create"><button type="button" class="btn btn-block" id="btn-create-room"></button></div>
      <div class="tab-panel" id="tab-join">
        <label for="input-room-code" id="lbl-code"></label>
        <input type="text" id="input-room-code" maxlength="5" autocomplete="off" style="text-transform:uppercase">
        <button type="button" class="btn btn-block" id="btn-join-room"></button>
      </div>
      <div class="tab-panel" id="tab-offline">
        <p class="muted small" id="offline-hint"></p>
        <button type="button" class="btn btn-block" id="btn-start-offline"></button>
      </div>
      <p class="muted small center" id="online-off-note" style="display:none"></p>
    </div>
  </section>

  <!-- ============ WAITING ROOM ============ -->
  <section id="screen-waiting" class="screen">
    <div class="waiting-card poly">
      <div class="room-code-box" id="room-code-box"><div class="label" id="room-code-label"></div><div class="code" id="room-code-display">-----</div></div>
      <h3 id="seats-title"></h3>
      <div id="seat-grid" class="seat-grid"></div>
      <div class="rules-box">
        <h3 id="rules-title"></h3>
        <div id="rules-list"></div>
        <p id="rules-readonly-hint" class="muted small"></p>
      </div>
      <button type="button" class="btn btn-block" id="btn-start-game"></button>
      <p id="waiting-hint" class="muted center"></p>
      <button type="button" class="btn btn-secondary btn-block" id="btn-leave-waiting"></button>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen">
    <div class="game-header">
      <h2><span id="game-title"></span> <span class="room-chip" id="game-room-code-label"></span> <span class="status-badge" id="spectator-badge" style="display:none"></span></h2>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="btn-rules"></button>
        <button type="button" class="icon-btn" id="btn-sound">🔊</button>
        <select class="lang-select" aria-label="Language"></select>
        <button type="button" class="icon-btn" id="btn-leave-game"></button>
      </div>
    </div>
    <div class="game-body">
      <div class="table">
        <div id="opps" class="opps"></div>
        <div id="turn-banner" class="turn-banner"></div>
        <div class="center">
          <div class="pile" id="deck-pile">
            <div class="pile-stack"><div class="p3">__BACK__</div><div class="p2">__BACK__</div><div class="p1">__BACK__</div></div>
            <div class="pile-label"><span>⛁</span> <b id="deck-count"></b></div>
          </div>
          <div class="pile" id="discard-pile"><div class="pile-stack" id="discard-top"></div></div>
          <div id="stage" class="stage"></div>
        </div>
        <div id="peek-known" class="peek-known" style="display:none"></div>
        <div id="nope-bar" class="nope-bar"></div>
        <div class="me-bar" id="me-bar">
          <div class="me-chip" id="me-chip"></div>
          <div class="me-actions">
            <button type="button" class="btn" id="btn-play"></button>
            <button type="button" class="btn btn-alt" id="btn-draw"></button>
          </div>
        </div>
        <p class="sub-hint muted" id="sub-hint"></p>
        <div id="hand" class="hand"></div>
      </div>
      <div class="side-panel"><div class="log-wrap"><div id="log-panel"></div></div></div>
    </div>
  </section>

  <div id="modal"></div>
  <div id="coop"></div>
  <div id="toast"></div>
  <div id="fx"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js?v=5"></script>
  <script src="js/i18n.js?v=5"></script>
  <script src="js/sounds.js?v=5"></script>
  <script src="js/cat-art.js?v=5"></script>
  <script src="js/meow-engine.js?v=5"></script>
  <script src="js/meow-net.js?v=5"></script>
  <script src="js/meow-fx.js?v=5"></script>
  <script src="js/meow-coop.js?v=5"></script>
  <script src="js/meow-ui.js?v=5"></script>
</body>
</html>
